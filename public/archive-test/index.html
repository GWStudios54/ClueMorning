<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a12">
<title>Deep Archive — 25 Floor Painted Test</title>
<link rel="preload" as="image" href="/archive-test/archive-newsroom-25.webp" type="image/webp">
<link rel="preload" as="image" href="/archive-test/archive-top.webp" type="image/webp">
<link rel="preload" as="image" href="/archive-test/archive-elevator-25.webp" type="image/webp">
<style>
:root{
  --ink:#090a12;
  --panel:rgba(11,12,20,.91);
  --line:#6b587a;
  --gold:#e1b55e;
  --text:#f4ead6;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:var(--ink);color:var(--text);
  font-family:"Courier New",monospace;
}
button{font:inherit}
.stage{
  position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(circle at 50% 11%,#342b27 0,#181824 43%,#090a12 100%);
}
.world{
  position:absolute;top:0;left:50%;
  width:min(1280px,120vw);
  transform:translate3d(-50%,0,0);
  will-change:transform;
  transition:transform 930ms cubic-bezier(.18,.88,.22,1);
  backface-visibility:hidden;
}
.stack{display:block;width:100%}
.scene{
  position:relative;display:block;width:100%;
  margin-top:-2px;overflow:hidden;background:#0b0d15;
  --shaft-width:13%;
}
.scene.new-art{--shaft-width:15%}
.scene:first-child{margin-top:0}
.scene img{
  display:block;width:100%;height:auto;
  user-select:none;pointer-events:none;
  image-rendering:pixelated;image-rendering:crisp-edges;
  filter:sepia(.08) saturate(.92) contrast(.97) brightness(.96);
}
.scene + .scene::before{
  content:"";position:absolute;z-index:4;left:0;right:0;top:0;height:36px;
  pointer-events:none;
  background:linear-gradient(to bottom,rgba(6,7,12,.8),rgba(6,7,12,.08) 55%,rgba(6,7,12,0));
}
.shaft-cover{
  position:absolute;z-index:3;top:0;bottom:0;left:50%;
  width:var(--shaft-width);transform:translateX(-50%);
  pointer-events:none;
  background:
    linear-gradient(90deg,
      #0b0e17 0 9%,
      #2a3345 9% 14%,
      #121a2a 14% 36%,
      #896226 36% 39%,
      #20293c 39% 49%,
      #b7822e 49% 51%,
      #20293c 51% 61%,
      #896226 61% 64%,
      #121a2a 64% 86%,
      #2a3345 86% 91%,
      #0b0e17 91%);
  box-shadow:
    inset 5px 0 10px rgba(223,178,76,.10),
    inset -5px 0 10px rgba(223,178,76,.10);
  opacity:.97;
}
.shaft-cover::before,.shaft-cover::after{
  content:"";position:absolute;top:0;bottom:0;width:2px;
  background:linear-gradient(#7b5720,#d6a243 50%,#7b5720);
  opacity:.72;
}
.shaft-cover::before{left:43%}
.shaft-cover::after{right:43%}
.tail{
  height:320px;margin-top:-2px;
  background:
    radial-gradient(circle at 50% 0,rgba(84,52,142,.24),transparent 42%),
    linear-gradient(to bottom,#0e0e19,#06060b 72%);
}
.retro-wash{
  position:fixed;inset:0;z-index:5;pointer-events:none;
  background:
    linear-gradient(to bottom,rgba(239,170,83,.055),rgba(89,57,79,.025) 52%,rgba(46,32,86,.07)),
    radial-gradient(circle at 50% 47%,transparent 0 52%,rgba(17,7,11,.22) 100%);
  mix-blend-mode:soft-light;
}
.scanlines{
  position:fixed;inset:0;z-index:6;pointer-events:none;
  opacity:.11;
  background:repeating-linear-gradient(to bottom,rgba(255,239,205,.04) 0 1px,rgba(0,0,0,.035) 1px 3px);
}
.grain{
  position:fixed;inset:0;z-index:7;pointer-events:none;opacity:.035;
  background:
    radial-gradient(circle at 12% 23%,#fff 0 .55px,transparent .9px),
    radial-gradient(circle at 68% 61%,#fff 0 .55px,transparent .9px),
    radial-gradient(circle at 39% 84%,#fff 0 .45px,transparent .8px),
    radial-gradient(circle at 83% 17%,#fff 0 .45px,transparent .8px);
  background-size:7px 9px,11px 13px,13px 11px,17px 15px;
  mix-blend-mode:overlay;
}
.vignette{
  position:fixed;inset:0;z-index:8;pointer-events:none;
  box-shadow:inset 0 0 94px rgba(0,0,0,.39);
}
.elevator{
  position:fixed;z-index:12;left:50%;top:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  transition:
    top 930ms cubic-bezier(.18,.88,.22,1),
    height 930ms cubic-bezier(.18,.88,.22,1);
  filter:sepia(.05) saturate(.95) drop-shadow(0 9px 10px rgba(0,0,0,.42));
}
.elevator img{
  display:block;height:100%;width:auto;
  image-rendering:pixelated;image-rendering:crisp-edges;
}
.hud{
  position:fixed;z-index:20;
  top:max(10px,env(safe-area-inset-top));left:10px;right:10px;
  pointer-events:none;
}
.card{
  width:min(430px,calc(100vw - 20px));
  padding:10px 12px;pointer-events:auto;
  background:var(--panel);border:3px solid var(--line);
  box-shadow:0 0 0 3px #07080d;
  backdrop-filter:blur(3px);
}
.card h1{margin:0 0 4px;color:var(--gold);font-size:14px;letter-spacing:.045em}
.card p{margin:0;color:#d9cfe0;font-size:9px;line-height:1.4}
.question-panel{
  position:fixed;z-index:22;left:10px;right:10px;
  bottom:calc(78px + env(safe-area-inset-bottom));
  width:min(620px,calc(100vw - 20px));
  margin:0 auto;padding:10px 12px;
  background:rgba(11,12,20,.95);
  border:3px solid var(--line);box-shadow:0 0 0 3px #07080d;
  backdrop-filter:blur(4px);
}
.question-meta{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  color:#cdbfd5;font-size:9px;font-weight:900;letter-spacing:.055em;
  text-transform:uppercase;
}
.question-meta strong{color:var(--gold);font-size:11px}
.question-text{
  margin-top:7px;color:#fff4de;font-size:14px;line-height:1.25;
  font-weight:900;text-wrap:balance;
}
.question-stats{
  margin-top:7px;color:#c7bccb;font-size:9px;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.question-stats strong{color:var(--gold)}
.feedback{
  min-height:16px;margin-top:5px;font-size:9px;font-weight:900;
  letter-spacing:.025em;color:#d9cfe0;
}
.feedback.good{color:#f2cf7c}
.feedback.bad{color:#e2a1aa}
.answer-controls{
  position:fixed;z-index:25;left:10px;right:10px;
  bottom:max(10px,env(safe-area-inset-bottom));
  width:min(620px,calc(100vw - 20px));margin:0 auto;
  display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:7px;
}
.answer-controls input{
  min-width:0;height:58px;padding:0 13px;
  color:#fff2dd;background:#171824;
  border:3px solid #725f88;box-shadow:0 0 0 3px #07080d;
  font:900 13px/1 "Courier New",monospace;
  outline:none;border-radius:0;
}
.answer-controls input:focus{border-color:#aa8ebd}
.answer-controls input::placeholder{color:#8f8694}
.answer-controls button{
  min-height:58px;padding:7px 13px;
  color:#fff2dd;background:#294248;
  border:3px solid #6b8790;box-shadow:0 0 0 3px #07080d;
  font-size:10px;font-weight:900;text-transform:uppercase;
  letter-spacing:.035em;touch-action:manipulation;
}
.answer-controls button:active{transform:translateY(2px)}
.answer-controls button:disabled,.answer-controls input:disabled{opacity:.58}
.answer-controls .reset{width:58px;background:#30263f;border-color:#725f88}
.flash{
  position:fixed;z-index:30;inset:0;pointer-events:none;
  opacity:0;background:rgba(255,224,164,.14);
  transition:opacity 115ms linear;
}
.flash.on{opacity:1}
.burst{position:fixed;z-index:29;left:50%;top:50%;pointer-events:none}
.spark{
  position:absolute;width:7px;height:7px;opacity:0;background:var(--gold);
  transition:transform 500ms cubic-bezier(.2,.9,.2,1),opacity 500ms ease;
}
@media(max-width:700px){
  .world{width:max(760px,185vw)}
  .card p{display:none}
  .question-panel{padding:9px 10px}
  .question-text{font-size:13px}
  .answer-controls input{font-size:12px}
  .vignette{box-shadow:inset 0 0 60px rgba(0,0,0,.32)}
  .scanlines{opacity:.085}
}
@media(max-height:620px){
  .card{display:none}
  .question-panel{bottom:74px}
  .question-text{font-size:12px}
}
@media(prefers-reduced-motion:reduce){
  .world,.elevator,.flash,.spark{transition-duration:1ms}
}
</style>
</head>
<body>
<div class="stage">
  <div class="world" id="world">
    <div class="stack" id="stack">
      <section class="scene new-art" data-pitch=".19" aria-label="Newsroom and print archive">
        <img src="/archive-test/archive-newsroom-25.webp" width="960" height="1200" alt="" loading="eager" decoding="async" fetchpriority="high">
        <div class="shaft-cover" aria-hidden="true"></div>
      </section>
      <section class="scene" data-pitch=".25" aria-label="Grand upper archive">
        <img src="/archive-test/archive-top.webp" width="1600" height="900" alt="" loading="eager" decoding="async">
        <div class="shaft-cover" aria-hidden="true"></div>
      </section>
      <section class="scene" data-pitch=".26" aria-label="Natural history archive">
        <img src="/archive-test/archive-middle.webp" width="1600" height="900" alt="" loading="lazy" decoding="async">
        <div class="shaft-cover" aria-hidden="true"></div>
      </section>
      <section class="scene new-art" data-pitch=".17" aria-label="Deep museum collections">
        <img src="/archive-test/archive-museum-25.webp" width="960" height="1200" alt="" loading="lazy" decoding="async">
        <div class="shaft-cover" aria-hidden="true"></div>
      </section>
      <section class="scene" data-pitch=".27" aria-label="Forbidden astral archive">
        <img src="/archive-test/archive-bottom.webp" width="1600" height="900" alt="" loading="lazy" decoding="async">
        <div class="shaft-cover" aria-hidden="true"></div>
      </section>
      <section class="scene new-art" data-pitch=".17" aria-label="Final cosmic archive">
        <img src="/archive-test/archive-cosmic-25.webp" width="960" height="1200" alt="" loading="lazy" decoding="async">
        <div class="shaft-cover" aria-hidden="true"></div>
      </section>
      <div class="tail" aria-hidden="true"></div>
    </div>
  </div>
</div>

<div class="retro-wash"></div>
<div class="scanlines"></div>
<div class="grain"></div>
<div class="vignette"></div>

<div class="elevator" id="elevator" aria-hidden="true">
  <img src="/archive-test/archive-elevator-25.webp" width="140" height="185" alt="">
</div>

<div class="hud">
  <div class="card">
    <h1>DEEP CUT — ARCHIVE TEST</h1>
    <p>Eight open-answer test prompts. Valid answers score by rarity and send the elevator deeper.</p>
  </div>
</div>

<div class="question-panel" id="questionPanel" aria-live="polite">
  <div class="question-meta">
    <span id="questionCount">QUESTION 1 OF 8</span>
    <span><strong id="timer">25</strong>s</span>
  </div>
  <div class="question-text" id="questionText">Loading test question…</div>
  <div class="question-stats">
    DEPTH <strong id="depth">0</strong> ft · <span id="zone">Newsroom Lobby</span>
    &nbsp;·&nbsp; SCORE <strong id="score">0</strong>
  </div>
  <div class="feedback" id="feedback">Any accepted answer counts. Less-obvious answers go deeper.</div>
</div>

<form class="answer-controls" id="answerForm" autocomplete="off">
  <input id="answerInput" name="answer" type="text" inputmode="text" maxlength="80" placeholder="Type an answer…" aria-label="Deep Cut answer">
  <button type="submit" id="submitAnswer">Submit</button>
  <button type="button" id="reset" class="reset" aria-label="Restart test run">↺</button>
</form>

<div class="flash" id="flash"></div>
<div class="burst" id="burst"></div>

<script>
(()=>{
  const world=document.getElementById('world');
  const stack=document.getElementById('stack');
  const scenes=[...stack.querySelectorAll('.scene')];
  const elevator=document.getElementById('elevator');
  const card=document.querySelector('.card');
  const depthEl=document.getElementById('depth');
  const zoneEl=document.getElementById('zone');
  const flash=document.getElementById('flash');
  const burst=document.getElementById('burst');
  const questionCountEl=document.getElementById('questionCount');
  const timerEl=document.getElementById('timer');
  const questionTextEl=document.getElementById('questionText');
  const scoreEl=document.getElementById('score');
  const feedbackEl=document.getElementById('feedback');
  const answerForm=document.getElementById('answerForm');
  const answerInput=document.getElementById('answerInput');
  const submitAnswer=document.getElementById('submitAnswer');

  /* 25 real landing positions: start + 24 possible floors of descent. */
  const landings=[
    {scene:0,y:.185,zone:'Newsroom Lobby'},
    {scene:0,y:.375,zone:'City Desk'},
    {scene:0,y:.565,zone:'Copy Desk'},
    {scene:0,y:.755,zone:'Print Floor'},
    {scene:0,y:.945,zone:'Morgue Files'},

    {scene:1,y:.941,zone:'Reference Hall'},

    {scene:2,y:.227,zone:'Natural History'},
    {scene:2,y:.488,zone:'Clockwork Museum'},
    {scene:2,y:.756,zone:'Specimen Vault'},
    {scene:2,y:.987,zone:'Deep Stacks'},

    {scene:3,y:.158,zone:'Atlas Gallery'},
    {scene:3,y:.326,zone:'Fossil Hall'},
    {scene:3,y:.495,zone:'Botanical Cabinet'},
    {scene:3,y:.671,zone:'Orrery Hall'},
    {scene:3,y:.832,zone:'Submerged Collection'},
    {scene:3,y:.985,zone:'Abyssal Zoology'},

    {scene:4,y:.289,zone:'Forbidden Observatory'},
    {scene:4,y:.547,zone:'Relic Gallery'},
    {scene:4,y:.842,zone:'Astral Stacks'},

    {scene:5,y:.132,zone:'Celestial Archive'},
    {scene:5,y:.286,zone:'Meteor Vault'},
    {scene:5,y:.405,zone:'Impossible Index'},
    {scene:5,y:.575,zone:'Black Shelf'},
    {scene:5,y:.724,zone:'Final Catalog'},
    {scene:5,y:.865,zone:'The Final Shelf'}
  ];

  const MAX_STOP=24;
  const FEET_PER_FLOOR=675;
  const TEST_SECONDS=25;

  const testQuestions=[
    {
      prompt:'Name a country beginning with B.',
      answers:[
        ['belgium',38],['brazil',42],['bolivia',55],['bulgaria',58],
        ['bahamas',67],['bahrain',73],['barbados',78],['belize',82],
        ['bosnia and herzegovina',86],['bosnia',86],['benin',88],
        ['bhutan',91],['burkina faso',93],['botswana',94],['burundi',96],['brunei',100]
      ]
    },
    {
      prompt:'Name a planet or dwarf planet in our Solar System.',
      answers:[
        ['earth',30],['mars',35],['jupiter',38],['saturn',40],['mercury',48],['venus',50],
        ['uranus',62],['neptune',65],['pluto',70],['ceres',88],['eris',90],
        ['makemake',93],['haumea',96]
      ]
    },
    {
      prompt:'Name a play by William Shakespeare.',
      answers:[
        ['hamlet',30],['romeo and juliet',32],['macbeth',35],['othello',45],
        ['king lear',48],['julius caesar',52],['the tempest',60],['twelfth night',65],
        ['much ado about nothing',68],['measure for measure',82],['cymbeline',88],
        ['coriolanus',92],['pericles',96],['timon of athens',100]
      ]
    },
    {
      prompt:'Name a moon of Jupiter.',
      answers:[
        ['europa',32],['io',35],['ganymede',38],['callisto',42],
        ['amalthea',66],['himalia',72],['thebe',78],['metis',82],
        ['elara',86],['pasiphae',90],['carme',92],['ananke',94],
        ['sinope',96],['lysithea',98],['leda',100],['adrastea',95]
      ]
    },
    {
      prompt:'Name a dinosaur genus.',
      answers:[
        ['tyrannosaurus',30],['t rex',30],['trex',30],['triceratops',34],['velociraptor',38],
        ['stegosaurus',42],['brachiosaurus',48],['ankylosaurus',52],['spinosaurus',58],
        ['allosaurus',62],['parasaurolophus',68],['deinonychus',74],['carnotaurus',80],
        ['therizinosaurus',86],['microraptor',92],['monolophosaurus',96],['yi',100]
      ]
    },
    {
      prompt:'Name a world capital beginning with M.',
      answers:[
        ['madrid',32],['moscow',36],['manila',40],['mexico city',44],
        ['minsk',58],['muscat',64],['maputo',72],['montevideo',76],
        ['mogadishu',82],['monrovia',86],['male',90],['malé',90],
        ['moroni',94],['mbabane',100]
      ]
    },
    {
      prompt:'Name a country in Africa.',
      answers:[
        ['south africa',30],['egypt',32],['nigeria',35],['kenya',38],['morocco',42],
        ['ethiopia',46],['ghana',52],['tanzania',58],['senegal',64],['botswana',68],
        ['namibia',72],['rwanda',76],['lesotho',86],['benin',88],
        ['djibouti',92],['eswatini',94],['comoros',96],['sao tome and principe',100],
        ['são tomé and príncipe',100]
      ]
    },
    {
      prompt:'Name a U.S. national park.',
      answers:[
        ['yellowstone',30],['yosemite',32],['grand canyon',34],['zion',38],
        ['glacier',42],['acadia',46],['olympic',52],['sequoia',56],
        ['great smoky mountains',58],['joshua tree',62],['everglades',66],
        ['great basin',82],['dry tortugas',86],['congaree',90],
        ['guadalupe mountains',92],['isle royale',94],['kobuk valley',98],
        ['gates of the arctic',100]
      ]
    }
  ];

  let stop=0;
  let resizeTimer=0;
  let questionIndex=0;
  let totalScore=0;
  let answered=false;
  let timerHandle=0;
  let deadline=0;

  function landingWorldY(item){
    const scene=scenes[item.scene];
    return scene.offsetTop+(scene.offsetHeight*item.y);
  }

  function floorPitchPx(item){
    const scene=scenes[item.scene];
    return scene.offsetHeight*Number(scene.dataset.pitch||.2);
  }

  function cameraAnchorY(){
    return Math.min(window.innerHeight*.52,window.innerHeight-245);
  }

  function topClampY(){
    const bottom=card?.getBoundingClientRect().bottom||82;
    return Math.max(72,bottom+8);
  }

  function apply(){
    const item=landings[stop];
    const landingY=landingWorldY(item);
    const pitch=floorPitchPx(item);

    /* One-floor-tall elevator, with a sane visual clamp between art families. */
    const carHeight=Math.max(128,Math.min(252,pitch*.86));
    elevator.style.height=Math.round(carHeight)+'px';

    /*
      Keep the top of the newsroom directly below the title instead of
      manufacturing empty space. Once a floor reaches the camera anchor,
      normal downward camera travel begins.
    */
    const desiredWorldY=cameraAnchorY()-landingY;
    const worldY=Math.min(topClampY(),desiredWorldY);
    world.style.transform='translate3d(-50%,'+Math.round(worldY)+'px,0)';

    /* The car's bottom edge sits on the selected balcony/floor line. */
    const landingScreenY=worldY+landingY;
    elevator.style.top=Math.round(landingScreenY-(carHeight/2)+2)+'px';

    depthEl.textContent=(stop*FEET_PER_FLOOR).toLocaleString();
    zoneEl.textContent=item.zone;
  }

  function rareBurst(){
    burst.replaceChildren();
    const sparks=[];
    for(let i=0;i<16;i++){
      const p=document.createElement('i');
      p.className='spark';
      burst.appendChild(p);
      const angle=(Math.PI*2*i)/16;
      const distance=42+(i%4)*15;
      sparks.push([p,Math.cos(angle)*distance,Math.sin(angle)*distance]);
    }
    requestAnimationFrame(()=>{
      for(const [p,x,y] of sparks){
        p.style.opacity='1';
        p.style.transform='translate3d('+x+'px,'+y+'px,0)';
      }
      setTimeout(()=>{for(const [p] of sparks)p.style.opacity='0'},110);
    });
    flash.classList.add('on');
    setTimeout(()=>flash.classList.remove('on'),110);
    setTimeout(()=>burst.replaceChildren(),620);
  }

  function normalizeAnswer(value){
    return String(value||'')
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .toLowerCase()
      .replace(/&/g,' and ')
      .replace(/[^a-z0-9]+/g,' ')
      .trim()
      .replace(/\s+/g,' ');
  }

  const answerMaps=testQuestions.map(q=>{
    const map=new Map();
    for(const [answer,score] of q.answers)map.set(normalizeAnswer(answer),score);
    return map;
  });

  function floorsForScore(score){
    if(score>=85)return 3;
    if(score>=60)return 2;
    return 1;
  }

  function rarityForScore(score){
    if(score>=100)return 'DEEPEST CUT';
    if(score>=85)return 'RARE';
    if(score>=60)return 'UNCOMMON';
    return 'COMMON';
  }

  function stopTimer(){
    if(timerHandle){
      clearTimeout(timerHandle);
      timerHandle=0;
    }
  }

  function tickTimer(){
    if(answered||questionIndex>=testQuestions.length)return;
    const remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));
    timerEl.textContent=String(remaining);
    if(remaining<=0){
      finishPrompt(null,0,true);
      return;
    }
    const untilNext=Math.max(120,Math.min(1000,(deadline-Date.now())%1000||1000));
    timerHandle=setTimeout(tickTimer,untilNext);
  }

  function startTimer(){
    stopTimer();
    deadline=Date.now()+(TEST_SECONDS*1000);
    timerEl.textContent=String(TEST_SECONDS);
    timerHandle=setTimeout(tickTimer,180);
  }

  function renderQuestion(){
    const q=testQuestions[questionIndex];
    answered=false;
    questionCountEl.textContent='QUESTION '+(questionIndex+1)+' OF '+testQuestions.length;
    questionTextEl.textContent=q.prompt;
    feedbackEl.className='feedback';
    feedbackEl.textContent='Any accepted answer counts. Invalid guesses do not end the prompt.';
    answerInput.disabled=false;
    submitAnswer.disabled=false;
    submitAnswer.textContent='Submit';
    answerInput.value='';
    startTimer();
  }

  function completeRun(){
    stopTimer();
    answered=true;
    questionCountEl.textContent='RUN COMPLETE';
    timerEl.textContent='—';
    questionTextEl.textContent=stop===MAX_STOP
      ? 'You reached The Final Shelf.'
      : 'Your archive run ended at '+landings[stop].zone+'.';
    feedbackEl.className='feedback good';
    feedbackEl.textContent='FINAL SCORE '+totalScore+' / 800 · '+stop+' / 24 FLOORS DESCENDED';
    answerInput.value='';
    answerInput.placeholder='Run complete';
    answerInput.disabled=true;
    submitAnswer.disabled=true;
    submitAnswer.textContent='Done';
  }

  function advanceQuestion(){
    questionIndex++;
    if(questionIndex>=testQuestions.length){
      completeRun();
      return;
    }
    renderQuestion();
    if(document.activeElement===answerInput){
      try{answerInput.focus({preventScroll:true})}catch(_){answerInput.focus()}
    }
  }

  function finishPrompt(answer,score,timedOut=false){
    if(answered)return;
    answered=true;
    stopTimer();
    answerInput.disabled=true;
    submitAnswer.disabled=true;

    if(timedOut){
      feedbackEl.className='feedback bad';
      feedbackEl.textContent='TIME · NO DESCENT';
    }else{
      const floors=floorsForScore(score);
      const rarity=rarityForScore(score);
      totalScore+=score;
      stop=Math.min(MAX_STOP,stop+floors);
      scoreEl.textContent=String(totalScore);
      feedbackEl.className='feedback good';
      feedbackEl.textContent=(answer||'ANSWER').toUpperCase()+' · '+rarity+' · '+score+' PTS · '+floors+' FLOOR'+(floors===1?'':'S');
      apply();
      if(score>=85)rareBurst();
    }

    setTimeout(advanceQuestion,1150);
  }

  answerForm.addEventListener('submit',event=>{
    event.preventDefault();
    if(answered||questionIndex>=testQuestions.length)return;
    const normalized=normalizeAnswer(answerInput.value);
    if(!normalized)return;
    const score=answerMaps[questionIndex].get(normalized);
    if(!score){
      feedbackEl.className='feedback bad';
      feedbackEl.textContent='NOT IN THIS TEST SET — KEEP GUESSING';
      answerInput.select();
      return;
    }
    finishPrompt(answerInput.value.trim(),score,false);
  });

  document.getElementById('reset').addEventListener('click',()=>{
    stopTimer();
    stop=0;
    questionIndex=0;
    totalScore=0;
    scoreEl.textContent='0';
    answerInput.placeholder='Type an answer…';
    apply();
    renderQuestion();
  });

  window.addEventListener('resize',()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(apply,100);
  },{passive:true});

  /* Reserve space immediately; warm later panels once the browser is idle. */
  const warmLater=()=>{
    [...stack.querySelectorAll('img[loading="lazy"]')].forEach(img=>{
      const preload=new Image();
      preload.src=img.src;
    });
  };
  if('requestIdleCallback' in window)requestIdleCallback(warmLater,{timeout:1800});
  else setTimeout(warmLater,900);

  apply();
  renderQuestion();
})();
</script>
</body>
</html>
