<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#17130e"><title>Letter Grid — The Typesetter Test</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#17130e}body{font-family:Georgia,"Times New Roman",serif;-webkit-user-select:none;user-select:none}button{font:inherit}.world{position:relative;width:100%;height:100dvh;min-height:560px;overflow:hidden;background:#17130e center/100% 100% no-repeat;color:#f4d996}.loading{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:#17130e;font:bold 11px sans-serif;letter-spacing:.15em}.ready .loading{display:none}
.back{position:absolute;z-index:12;left:2.6%;top:5.5%;width:27%;height:3.8%;border:1px solid #a67831;border-radius:999px;background:rgba(213,180,112,.91);color:#2e1e10;font:bold clamp(8px,2.3vw,12px)/1 sans-serif;letter-spacing:.06em}.reset{position:absolute;z-index:12;right:2.8%;top:5.5%;width:10.5%;aspect-ratio:1;border:1px solid #b27c2e;border-radius:50%;background:rgba(216,183,111,.92);color:#352213;font:bold clamp(18px,5vw,27px)/1 serif}
.title{position:absolute;z-index:6;left:17%;top:8.15%;width:66%;height:8.2%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;text-shadow:0 2px #050605}.title small{font:bold clamp(7px,2vw,11px)/1 sans-serif;letter-spacing:.2em;color:#d6af62}.title h1{margin:5px 0 0;font-size:clamp(21px,6.2vw,35px);line-height:1;letter-spacing:.035em;color:#f1d18a}
.stats{position:absolute;z-index:6;left:16.2%;top:17.55%;width:67.4%;height:4.75%;display:grid;grid-template-columns:repeat(4,1fr)}.stat{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:sans-serif}.stat strong{font-size:clamp(12px,3.7vw,21px);line-height:1;color:#f3d58d}.stat span{margin-top:3px;font:bold clamp(5px,1.35vw,8px)/1 sans-serif;letter-spacing:.1em;color:#c9a35c}
.instruction{position:absolute;z-index:6;left:23%;top:26.8%;width:54%;text-align:center;color:#5a3a20;font:italic clamp(10px,2.8vw,16px)/1.1 Georgia}
.proof{--cols:5;position:absolute;z-index:7;left:29.55%;top:31.05%;width:40.9%;height:23.9%;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(6,1fr);gap:2.15% 1.8%}.cell{display:grid;place-items:center;min-width:0;padding:.16em 0 0;border:1px solid #80602e;border-radius:2px;background:rgba(239,222,184,.75);box-shadow:inset 0 0 0 1px rgba(255,250,222,.55),0 1px 2px rgba(55,31,10,.42);color:#332215;font:bold clamp(13px,4.3vw,24px)/1 Georgia;text-shadow:0 1px rgba(255,255,255,.45);transition:.2s}.cell.filled{animation:set .1s ease-out}.cell.absent{background:rgba(57,54,48,.91);color:#f2dfb5;text-shadow:none}.cell.present{background:rgba(183,124,14,.92);color:#fff0c2;text-shadow:0 1px #5e3a05}.cell.correct{background:rgba(39,115,64,.94);color:#fff4c9;text-shadow:0 1px #173c24}@keyframes set{50%{transform:scale(1.08)}}
.keyboard{position:absolute;z-index:8;left:16.7%;top:65.2%;width:66.6%;height:10.5%;display:flex;flex-direction:column;gap:6%}.key-row{display:flex;justify-content:center;gap:1.15%;height:29.4%}.key{height:100%;min-width:0;padding:.11em 0 0;border:0;border-radius:3px;background:transparent;color:#f0d59b;font:bold clamp(9px,3vw,17px)/1 Georgia;text-align:center;text-indent:.02em;text-shadow:0 1px #000;transition:filter .12s,color .12s,background .12s}.key-row:nth-child(1) .key{width:9%}.key-row:nth-child(2) .key{width:9.9%}.key-row:nth-child(3) .key{width:12%}.key.absent{color:#716553;filter:brightness(.52)}.key.present{color:#ffdc73;background:rgba(169,108,9,.46);box-shadow:inset 0 0 0 1px #b57c18}.key.correct{color:#d8f3b5;background:rgba(43,119,59,.55);box-shadow:inset 0 0 0 1px #5fa365}
.actions{position:absolute;z-index:9;left:15%;top:77.2%;width:70%;height:4.1%;display:grid;grid-template-columns:1fr 1.42fr;gap:7.3%}.actions button{border:0;background:transparent;color:#f0d492;font:bold clamp(8px,2.5vw,14px)/1 sans-serif;letter-spacing:.08em}.actions .press{color:#f5dda0}.actions button:disabled{opacity:.38}
.toast{position:absolute;z-index:20;left:50%;bottom:max(4%,env(safe-area-inset-bottom));transform:translate(-50%,14px);opacity:0;width:max-content;max-width:88%;padding:9px 14px;border:1px solid #c49545;border-radius:999px;background:rgba(17,14,10,.95);color:#f8dda0;font:bold 10px/1.2 sans-serif;text-align:center;transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{border-color:#a94b3b;color:#ffd0b8}
@media(min-width:700px){.world{width:min(46.15vh,520px);margin:auto;box-shadow:0 0 70px #000}}
</style></head><body><main class="world" id="world"><div class="loading">SETTING THE TYPE…</div><button class="back">← MORNING RUN</button><button class="reset" aria-label="Reset">↻</button><header class="title"><small>LETTER GRID</small><h1>THE TYPESETTER</h1></header><section class="stats"><div class="stat"><strong>6</strong><span>LETTERS</span></div><div class="stat"><strong id="guessStat">0/6</strong><span>GUESSES</span></div><div class="stat"><strong id="score">0</strong><span>SCORE</span></div><div class="stat"><strong id="best">—</strong><span>BEST</span></div></section><div class="instruction">Set the word, then pull the press</div><div class="proof" id="proof"></div><div class="keyboard" id="keyboard"></div><div class="actions"><button class="clear">CLEAR</button><button class="press">PULL PRESS</button></div><div class="toast" id="toast"></div></main><script type="application/disabled">
(()=>{const ANSWER='BRIGHT',ROWS=6,COLS=6,BEST_KEY='clue-letter-grid-test-best',VALID=new Set(['BRIGHT','PLANET','STREAM','POCKET','SILVER','MARKET','CANDLE','CASTLE','WINTER','GARDEN','THREAD','LETTER','PRINTS','COFFEE','ORANGE','PURPLE']);const world=document.querySelector('#world'),proof=document.querySelector('#proof'),keyboard=document.querySelector('#keyboard'),toast=document.querySelector('#toast');let row=0,current='',done=false,bestScore=Number(localStorage.getItem(BEST_KEY)||0),keyState={};Promise.all(Array.from({length:5},(_,i)=>fetch(`./bg-${String(i).padStart(2,'0')}.b64`).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}))).then(parts=>{world.style.backgroundImage=`url(data:image/webp;base64,${parts.join('')})`;world.classList.add('ready')}).catch(()=>document.querySelector('.loading').textContent='PRINT SHOP ART FAILED TO LOAD');for(let i=0;i<ROWS*COLS;i++){const c=document.createElement('div');c.className='cell';proof.appendChild(c)}for(const letters of ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM']){const line=document.createElement('div');line.className='key-row';for(const ch of letters){const b=document.createElement('button');b.className='key';b.textContent=ch;b.dataset.key=ch;b.onclick=()=>type(ch);line.appendChild(b)}keyboard.appendChild(line)}function rank(s){return{absent:1,present:2,correct:3}[s]||0}function paint(){for(let c=0;c<COLS;c++){const cell=proof.children[row*COLS+c];if(!cell)return;cell.textContent=current[c]||'';cell.classList.toggle('filled',!!current[c])}[...keyboard.querySelectorAll('.key')].forEach(k=>{k.className='key'+(keyState[k.dataset.key]?' '+keyState[k.dataset.key]:'')});document.querySelector('#guessStat').textContent=`${row}/6`;document.querySelector('#best').textContent=bestScore||'—';document.querySelector('.press').disabled=current.length!==COLS||done}function type(ch){if(done||current.length>=COLS)return;current+=ch;paint()}function clear(){if(done)return;current=current.slice(0,-1);paint()}function feedback(guess){const out=Array(COLS).fill('absent'),left={};for(let i=0;i<COLS;i++){if(guess[i]===ANSWER[i])out[i]='correct';else left[ANSWER[i]]=(left[ANSWER[i]]||0)+1}for(let i=0;i<COLS;i++)if(out[i]!=='correct'&&left[guess[i]]){out[i]='present';left[guess[i]]--}return out}function flash(msg,bad=false){toast.textContent=msg;toast.className='toast show'+(bad?' bad':'');clearTimeout(flash.t);flash.t=setTimeout(()=>toast.className='toast',1450)}function submit(){if(done||current.length!==COLS)return;if(!VALID.has(current)){flash(`${current} is not in this test dictionary.`,true);return}const guess=current,result=feedback(guess),usedRow=row;result.forEach((state,i)=>{const cell=proof.children[usedRow*COLS+i];cell.className='cell '+state;const ch=guess[i];if(rank(state)>rank(keyState[ch]))keyState[ch]=state});row++;current='';const won=guess===ANSWER;if(won){done=true;const points=Math.max(100,700-row*100);document.querySelector('#score').textContent=points;bestScore=Math.max(bestScore,points);localStorage.setItem(BEST_KEY,String(bestScore));flash(`PERFECT IMPRESSION — ${points} points.`)}else if(row>=ROWS){done=true;flash(`OUT OF PROOFS — the word was ${ANSWER}.`,true)}paint()}function reset(){row=0;current='';done=false;keyState={};[...proof.children].forEach(c=>{c.textContent='';c.className='cell'});document.querySelector('#score').textContent='0';paint();flash('Fresh proof loaded.')}document.querySelector('.clear').onclick=clear;document.querySelector('.press').onclick=submit;document.querySelector('.reset').onclick=reset;document.querySelector('.back').onclick=()=>location.href='/?play=letter';document.addEventListener('keydown',e=>{const k=e.key.toUpperCase();if(/^[A-Z]$/.test(k))type(k);else if(e.key==='Backspace')clear();else if(e.key==='Enter')submit()});paint()})();
</script><script src="app.js"></script></body></html>
