<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#0b0c12">
  <title>Triple Link — The Switchboard Test</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#090a0f;color:#f4ddae}
    body{
      min-height:100dvh;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      overflow-x:hidden;
      font-family:"Courier New",monospace;
      background:
        radial-gradient(circle at 50% 18%,rgba(39,53,79,.32),transparent 38%),
        linear-gradient(#090b12,#06070b);
    }
    button,input{font:inherit}
    button{cursor:pointer}
    .shell{
      position:relative;
      width:min(100vw,600px);
      aspect-ratio:9/16;
      overflow:hidden;
      background:#11121a;
      isolation:isolate;
      box-shadow:0 0 42px rgba(0,0,0,.8);
    }
    .scene{
      position:absolute;inset:0;width:100%;height:100%;
      object-fit:cover;image-rendering:pixelated;
      opacity:0;transition:opacity .22s ease;
      user-select:none;pointer-events:none;
    }
    .ready .scene{opacity:1}
    .loading{
      position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);
      padding:.65em .9em;border:1px solid #a86f2d;border-radius:7px;
      background:rgba(8,9,14,.93);color:#e8c782;
      font-size:clamp(9px,2.5vw,13px);font-weight:900;letter-spacing:.08em;
    }
    .ready .loading{display:none}
    .live{position:absolute;z-index:10}
    .gold{color:#f2d48e;text-shadow:0 2px 0 #3a2411,0 0 9px rgba(255,189,72,.25)}
    .muted{color:#d6c7b2}
    .fit{
      display:flex;align-items:center;justify-content:center;
      text-align:center;white-space:nowrap;overflow:hidden;
    }

    .back{
      left:4.4%;top:1.3%;width:22.7%;height:4.6%;
      border:0;background:transparent;color:#f3d79b;
      font:900 clamp(8px,2.55vw,14px)/1 "Courier New",monospace;
      text-shadow:0 2px 0 #2a180b;
    }
    .back span{margin-left:.42em}
    .title{
      left:27%;top:1.1%;width:46%;height:6.9%;
      flex-direction:column;gap:.08em;pointer-events:none;
    }
    .title small{
      display:block;font:900 clamp(6px,1.85vw,10px)/1 "Courier New",monospace;
      letter-spacing:.18em;color:#d5aa65;
    }
    .title strong{
      display:block;font:700 clamp(13px,4.05vw,23px)/1 Georgia,serif;
      color:#f2d49a;letter-spacing:.02em;text-shadow:0 2px 0 #3a210f;
    }
    .reset{
      left:86.3%;top:1.1%;width:10.2%;height:5.4%;
      border:0;background:transparent;color:#f5d99e;
      font-size:clamp(17px,5.7vw,31px);font-weight:900;
      text-shadow:0 2px 0 #2e190a;
    }
    .subhead{
      left:25%;top:8.2%;width:50%;height:2.5%;
      color:#f0e6d5;font:700 clamp(7px,2.25vw,13px)/1.15 Georgia,serif;
      text-shadow:0 2px 3px rgba(0,0,0,.9);pointer-events:none;
    }

    .stat{top:11.6%;height:5.6%;flex-direction:column;gap:.06em;pointer-events:none}
    .stat strong{font:900 clamp(13px,4.3vw,24px)/1 "Courier New",monospace;color:#f4dfa9;text-shadow:0 2px 0 #2e1a0b}
    .stat span{font:900 clamp(5px,1.6vw,9px)/1 "Courier New",monospace;color:#d8c9bd;letter-spacing:.08em}
    .score{left:16.3%;width:22.2%}
    .streak{left:40.6%;width:20.2%}
    .tries{left:63.8%;width:22.3%}

    .clue{
      top:33.65%;height:4.4%;
      display:flex;align-items:center;justify-content:center;
      padding:0 5%;
      overflow:hidden;white-space:nowrap;text-align:center;
      color:#f1dba9;font:900 clamp(10px,2.8vw,16px)/1 "Courier New",monospace;
      letter-spacing:.08em;text-shadow:0 2px 0 #311c0c;
      transition:filter .22s,transform .22s,color .22s;
      pointer-events:none;
    }
    .clue.one{left:15.55%;width:20.8%}
    .clue.two{left:40.35%;width:19.3%}
    .clue.three{left:64.15%;width:20.7%}
    .clue.connected{
      color:#fff0b8;filter:drop-shadow(0 0 6px #ffd05a);
      transform:scale(1.035);
    }

    .answer{
      left:34.7%;top:47.2%;width:30.5%;height:6.4%;
      display:flex;align-items:center;justify-content:center;
      padding:0 7%;
      overflow:hidden;white-space:nowrap;text-align:center;
      color:#42230e;font:900 clamp(13px,4.4vw,25px)/1 "Courier New",monospace;
      letter-spacing:.1em;text-shadow:0 1px rgba(255,255,255,.4);
      pointer-events:none;
      transition:filter .2s,transform .2s;
    }
    .answer.locked{filter:drop-shadow(0 0 10px rgba(255,205,79,.9));transform:scale(1.045)}

    .attempt-label{
      z-index:12;
      left:37%;top:55.2%;width:26%;height:2.5%;
      color:#e9cea0;font:900 clamp(6px,1.9vw,11px)/1 "Courier New",monospace;
      letter-spacing:.12em;pointer-events:none;text-shadow:0 2px #2d190d;
    }
    /* The background bulb art is masked tightly; these live bulbs own the state. */
    .attempt{
      position:absolute;
      z-index:13;
      top:58.35%;
      width:6.15%;
      aspect-ratio:1;
      border-radius:50%;
      pointer-events:none;
      opacity:1;
      transform:scale(1);
      transition:transform .16s ease,filter .16s ease;
      background:
        radial-gradient(circle at 50% 46%,
          rgba(18,14,13,.99) 0 45%,
          rgba(18,14,13,.95) 56%,
          rgba(18,14,13,.5) 66%,
          transparent 75%);
    }
    .attempt.a1{left:38.65%}.attempt.a2{left:46.85%}.attempt.a3{left:55.05%}
    .attempt::before{
      content:"";
      position:absolute;
      left:27%;
      top:17%;
      width:46%;
      height:46%;
      border-radius:53% 53% 44% 44%;
      background:
        radial-gradient(circle at 38% 28%,#d7d4d2 0 8%,#a9a5a7 20%,#747178 48%,#47444a 73%,#28262b 100%);
      box-shadow:
        inset -1px -2px 0 rgba(20,18,22,.38),
        0 1px 2px rgba(0,0,0,.5);
    }
    .attempt::after{
      content:"";
      position:absolute;
      left:37%;
      top:59%;
      width:26%;
      height:18%;
      border-radius:1px;
      background:
        linear-gradient(#a97e42 0 20%,#4c3826 21% 41%,#8e6939 42% 62%,#392b20 63% 79%,#795934 80%);
      box-shadow:0 1px 1px rgba(0,0,0,.5);
    }
    .attempt.on::before,
    .success .attempt::before{
      background:
        radial-gradient(circle at 38% 28%,#fffbd0 0 10%,#ffe37d 22%,#ffc24b 44%,#ed8b22 68%,#aa5315 100%);
      box-shadow:
        0 0 5px rgba(255,198,78,.95),
        0 0 10px rgba(255,155,33,.55),
        inset -1px -2px 0 rgba(173,76,13,.18);
    }
    .attempt.on,
    .success .attempt{
      filter:drop-shadow(0 0 3px rgba(255,176,48,.5));
      transform:scale(1.015);
    }


    .feedback{
      left:11%;top:64.7%;width:78%;min-height:2.9%;
      display:flex;align-items:center;justify-content:center;text-align:center;
      padding:0 .75em;border-radius:6px;
      background:rgba(8,9,14,.78);
      color:#f4e5c9;font:900 clamp(7px,1.95vw,11px)/1.1 "Courier New",monospace;
      text-shadow:0 2px 3px rgba(0,0,0,.98);pointer-events:none;
    }
    .feedback.good{color:#ffe18b}.feedback.bad{color:#f1b0a0}

    .entry{
      left:18.4%;top:68.2%;width:63.4%;height:6%;
      display:flex;align-items:center;
    }
    .entry input{
      width:100%;height:100%;border:0;outline:0;padding:0 5%;
      background:transparent;color:#f1e4d5;text-align:center;
      font:900 clamp(12px,3.7vw,21px)/1 "Courier New",monospace;
      letter-spacing:.12em;text-transform:uppercase;
      caret-color:#f1d07e;
    }
    .entry input::placeholder{color:#8e8792;opacity:.9;letter-spacing:.08em}
    .entry input:focus{filter:drop-shadow(0 0 4px rgba(244,198,94,.45))}
    .entry input:disabled{opacity:.8}

    .connect{
      left:18.7%;top:75.1%;width:41.2%;height:5.4%;
      border:0;background:transparent;color:#f5dda9;
      font:900 clamp(10px,3.2vw,18px)/1 "Courier New",monospace;
      letter-spacing:.09em;text-shadow:0 2px #2d180b;
    }
    .clear{
      left:63.3%;top:75.1%;width:18.9%;height:5.4%;
      border:0;background:transparent;color:#ddd0c5;
      font:900 clamp(8px,2.5vw,14px)/1 "Courier New",monospace;
      letter-spacing:.06em;text-shadow:0 2px #21140d;
    }
    .connect:active,.clear:active,.reset:active,.back:active{transform:translateY(1px) scale(.985)}
    button:disabled{cursor:default;opacity:.55}

    .caption{
      left:22%;top:81.4%;width:56%;height:3.3%;
      color:#eadbc4;font:700 clamp(6px,1.85vw,10px)/1.2 Georgia,serif;
      text-shadow:0 2px 3px rgba(0,0,0,.9);pointer-events:none;
    }

    .result{
      position:absolute;z-index:16;left:11%;top:64.7%;
      width:78%;min-height:2.9%;
      display:flex;align-items:center;justify-content:center;text-align:center;
      padding:0 .75em;border:0;border-radius:6px;
      background:rgba(8,9,14,.86);
      color:#f7df9c;
      font:900 clamp(7px,1.95vw,11px)/1.12 "Courier New",monospace;
      text-shadow:0 2px 3px rgba(0,0,0,.98);
      opacity:0;pointer-events:none;
      transform:none;
      transition:opacity .18s ease;
    }
    .result.show{opacity:1;transform:none}
    .result strong{color:#ffe393;letter-spacing:.08em}
    .board-flash{
      position:absolute;z-index:9;left:12.8%;top:30.7%;width:74.5%;height:28%;
      border-radius:18%;pointer-events:none;opacity:0;
      box-shadow:inset 0 0 48px rgba(255,195,65,.72),0 0 42px rgba(255,167,38,.34);
    }
    .success-burst{
      position:absolute;z-index:14;left:50%;top:49.5%;width:31%;aspect-ratio:1;
      transform:translate(-50%,-50%) scale(.45);
      border-radius:50%;pointer-events:none;opacity:0;
      background:radial-gradient(circle,rgba(255,244,181,.62) 0 8%,rgba(255,197,67,.28) 20%,transparent 66%);
      mix-blend-mode:screen;
    }
    .success .board-flash{animation:successFlash .9s ease-out 1}
    .success .success-burst{animation:successBurst .75s ease-out 1}
    .success .answer.locked{animation:answerWin .68s cubic-bezier(.2,.8,.2,1) 1}
    .success .clue.one{animation:clueWin .42s ease-out .02s 1}
    .success .clue.two{animation:clueWin .42s ease-out .10s 1}
    .success .clue.three{animation:clueWin .42s ease-out .18s 1}
    .success .score strong{animation:scoreWin .58s ease-out .24s 1}
    .wrong .shell-inner{animation:shake .22s linear 1}
    @keyframes successFlash{0%{opacity:0}28%{opacity:1}100%{opacity:0}}
    @keyframes successBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}35%{opacity:.9}100%{opacity:0;transform:translate(-50%,-50%) scale(1.55)}}
    @keyframes answerWin{0%{filter:none;transform:scale(1)}48%{filter:drop-shadow(0 0 15px #ffd469);transform:scale(1.095)}100%{filter:drop-shadow(0 0 9px rgba(255,205,79,.82));transform:scale(1.04)}}
    @keyframes clueWin{0%{transform:scale(1)}55%{transform:scale(1.065);filter:drop-shadow(0 0 8px #ffd05a)}100%{transform:scale(1.035);filter:drop-shadow(0 0 6px #ffd05a)}}
    @keyframes scoreWin{0%{transform:scale(1)}45%{transform:scale(1.2);text-shadow:0 0 10px #ffd66d}100%{transform:scale(1)}}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

    @media(min-width:601px){
      body{padding:18px 0}
      .shell{border-radius:10px}
    }
  
    /* Final clean-background alignment: clean painted panels + live game lighting. */
    .back{
      left:8.0%;top:1.35%;width:19.2%;height:5%;
      padding:0;
      display:flex;align-items:center;justify-content:center;text-align:center;
      color:#f1d69b;
      font-size:clamp(8px,2.15vw,12px);
      white-space:nowrap;overflow:hidden;
    }
    .back span{margin:0}
    .title{
      left:29%;top:1.35%;width:42%;height:6.6%;
      gap:.12em;
    }
    .title small{font-size:clamp(6px,1.65vw,9px);letter-spacing:.16em}
    .title strong{font-size:clamp(13px,3.9vw,22px);letter-spacing:.015em}
    .reset{
      left:85.4%;top:1.35%;width:11.4%;height:5.1%;
      color:transparent;text-shadow:none;
    }
    .subhead,.caption{display:none}

    .stat{
      top:11.45%;height:5.25%;
      display:flex;align-items:center;justify-content:center;text-align:center;
    }
    .score{left:15.55%;width:21.5%}
    .streak{left:39.65%;width:20.2%}
    .tries{left:61.55%;width:21.6%}
    .stat strong{font-size:clamp(13px,4.15vw,23px)}
    .stat span{font-size:clamp(5px,1.45vw,8px)}

    .clue{
      top:34.0%;height:3.45%;
      display:flex;align-items:center;justify-content:center;text-align:center;
      padding:0 5%;
      font-size:clamp(10px,2.75vw,16px);
      letter-spacing:.07em;
      white-space:nowrap;overflow:hidden;
    }
    .clue.one{left:15.25%;width:20.7%}
    .clue.two{left:39.55%;width:20.55%}
    .clue.three{left:63.45%;width:19.8%}

    .answer{
      left:35.85%;top:47.7%;width:26.7%;height:5.15%;
      display:flex;align-items:center;justify-content:center;text-align:center;
      padding:0 6%;
      font-size:clamp(13px,4vw,23px);
      white-space:nowrap;overflow:hidden;
    }

    .attempt-label{
      left:38%;top:55.45%;width:24%;height:2%;
      display:flex;align-items:center;justify-content:center;text-align:center;
      font-size:clamp(6px,1.65vw,9px);
    }

    /* Bulbs are painted OFF. These transparent nodes only add illumination. */
    .attempt{
      z-index:13;
      top:58.2%;
      width:7%;
      aspect-ratio:1;
      border-radius:50%;
      background:transparent!important;
      opacity:0;
      transform:none!important;
      filter:none!important;
      box-shadow:none!important;
      transition:opacity .18s ease;
      pointer-events:none;
    }
    .attempt.a1{left:37.2%}
    .attempt.a2{left:46.3%}
    .attempt.a3{left:55.5%}
    .attempt::before,.attempt::after{content:none!important}

    .attempt.on,.success .attempt{opacity:1}

    /* Lighting only: visible halo with a transparent center, so the baked bulb remains untouched. */
    .attempt.on,.success .attempt{
      opacity:1;
      box-shadow:
        0 0 9px 3px rgba(255,218,120,.26),
        0 0 20px 8px rgba(255,171,61,.18),
        0 0 34px 13px rgba(255,120,24,.08)!important;
    }
    .attempt.on::before,.success .attempt::before{
      content:""!important;
      position:absolute;
      inset:-95%;
      border-radius:50%;
      background:radial-gradient(circle,
        transparent 0 24%,
        rgba(255,247,207,.18) 31%,
        rgba(255,221,126,.24) 39%,
        rgba(255,177,66,.18) 49%,
        rgba(255,132,33,.09) 60%,
        transparent 74%);
      filter:blur(2.2px);
      mix-blend-mode:screen;
      pointer-events:none;
    }
    .attempt.on::after,.success .attempt::after{content:none!important}

    .feedback{
      left:13%;top:64.0%;width:74%;min-height:2.5%;
      display:flex;align-items:center;justify-content:center;text-align:center;
      padding:0 .55em;
      background:rgba(8,9,14,.58);
      font-size:clamp(7px,1.7vw,10px);
    }
    .result{
      left:13%;top:64.0%;width:74%;min-height:2.5%;
      display:flex;align-items:center;justify-content:center;text-align:center;
      padding:0 .55em;
      font-size:clamp(7px,1.7vw,10px);
    }

    .entry{
      left:18.35%;top:67.75%;width:62.5%;height:4.8%;
      display:flex;align-items:center;justify-content:center;
    }
    .entry input{
      width:100%;height:100%;
      padding:0 6%;
      font-size:clamp(12px,3.45vw,20px);
      background:transparent;
      text-align:center;
    }
    .entry input::placeholder{text-align:center}

    .connect{
      left:18.35%;top:73.7%;width:40.4%;height:4.75%;
      display:flex;align-items:center;justify-content:center;text-align:center;
      font-size:clamp(10px,2.9vw,17px);
    }
    .clear{
      left:61.15%;top:73.7%;width:19.3%;height:4.75%;
      display:flex;align-items:center;justify-content:center;text-align:center;
      font-size:clamp(8px,2.25vw,13px);
    }

  </style>
</head>
<body>
  <main class="shell" id="shell">
    <div class="shell-inner" style="position:absolute;inset:0">
      <img id="scene" class="scene" alt="">
      <div class="loading">OPENING THE SWITCHBOARD…</div>

      <button class="live back fit" id="back" type="button" aria-label="Return to Clue Morning"><span>MORNING RUN</span></button>
      <div class="live title fit"><small>TRIPLE LINK</small><strong>THE SWITCHBOARD</strong></div>
      <button class="live reset fit" id="reset" type="button" aria-label="Reset test">↻</button>
      <div class="live subhead fit" id="subhead">One word connects all three.</div>

      <div class="live stat score fit"><strong id="score">1000</strong><span>SCORE</span></div>
      <div class="live stat streak fit"><strong>7</strong><span>STREAK</span></div>
      <div class="live stat tries fit"><strong id="tries">3/3</strong><span>TRIES</span></div>

      <div class="live clue one fit" data-clue>FLOWER</div>
      <div class="live clue two fit" data-clue>LIGHT</div>
      <div class="live clue three fit" data-clue>SET</div>
      <div class="live answer fit" id="answer"></div>
      <div class="live attempt-label fit">ATTEMPTS</div>

      <span class="attempt a1" data-attempt="0"></span>
      <span class="attempt a2" data-attempt="1"></span>
      <span class="attempt a3" data-attempt="2"></span>

      <div class="live feedback fit" id="feedback" aria-live="polite">Three lines are waiting.</div>
      <form class="live entry" id="form">
        <input id="guess" maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ONE WORD" aria-label="Connecting word">
      </form>
      <button class="live connect fit" id="connect" type="button">CONNECT</button>
      <button class="live clear fit" id="clear" type="button">CLEAR</button>
      <div class="live caption fit">Patch the right word through all three lines.</div>

      <div class="result" id="result"></div>
      <div class="board-flash"></div>
      <div class="success-burst" aria-hidden="true"></div>
    </div>
  </main>

  <script>
  (() => {
    const ANSWER='SUN';
    const LINKS=['SUNFLOWER','SUNLIGHT','SUNSET'];
    const AWARD=[0,1000,600,400],PROJECTED=[1000,600,400,0];
    let guesses=0,done=false;

    const $=s=>document.querySelector(s);
    const shell=$('#shell'),input=$('#guess'),answer=$('#answer'),feedback=$('#feedback'),result=$('#result');

    async function loadScene(){
      const files=[
        './final-bg/bg-00.b64','./final-bg/bg-01.b64','./final-bg/bg-02.b64','./final-bg/bg-03.b64',
        './final-bg/bg-04.b64','./final-bg/bg-05.b64','./final-bg/bg-06.b64','./final-bg/bg-07.b64',
        './final-bg/bg-08.b64','./final-bg/bg-09.b64'
      ];
      try{
        const parts=await Promise.all(files.map(async url=>{
          const r=await fetch(url,{cache:'no-store'});
          if(!r.ok)throw new Error('Switchboard background '+r.status);
          return (await r.text()).trim();
        }));
        const img=$('#scene');
        const ready=()=>shell.classList.add('ready');
        img.addEventListener('load',ready,{once:true});
        img.addEventListener('error',ready,{once:true});
        img.src='data:image/webp;base64,'+parts.join('');
        if(img.complete&&img.naturalWidth)ready();
      }catch(err){
        console.error(err);
        shell.classList.add('ready');
        feedback.textContent='Background failed to load.';
        feedback.className='live feedback fit bad';
      }
    }

    function sanitize(v){return String(v||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,24)}
    function fitTextBox(el,minPx=8){
      if(!el)return;
      el.style.fontSize='';
      const style=getComputedStyle(el);
      let size=parseFloat(style.fontSize)||16;
      const maxWidth=el.clientWidth;
      const maxHeight=el.clientHeight;
      while(size>minPx&&(el.scrollWidth>maxWidth||el.scrollHeight>maxHeight)){
        size-=.5;
        el.style.fontSize=size+'px';
      }
    }
    function fitSwitchboardText(){
      document.querySelectorAll('[data-clue]').forEach(el=>fitTextBox(el,7));
      fitTextBox(answer,9);
      fitTextBox(feedback,7);
      if(result.classList.contains('show'))fitTextBox(result,7);
    }
    function setFeedback(text,type=''){
      feedback.textContent=text;
      feedback.className='live feedback fit'+(type?' '+type:'');
      requestAnimationFrame(fitSwitchboardText);
    }
    function syncPlate(){
      if(done&&answer.textContent)return;
      answer.textContent=sanitize(input.value);
      requestAnimationFrame(fitSwitchboardText);
    }
    function syncAttempts(){
      const remaining=Math.max(0,3-guesses);
      $('#tries').textContent=remaining+'/3';
      if(!done)$('#score').textContent=String(PROJECTED[guesses]||0);
      const bulbs=[...document.querySelectorAll('[data-attempt]')];
      bulbs.forEach((el,i)=>{
        el.classList.toggle('on',i<remaining);
      });
    }
    function pulseWrong(){
      shell.classList.remove('wrong');
      void shell.offsetWidth;
      shell.classList.add('wrong');
      setTimeout(()=>shell.classList.remove('wrong'),260);
    }
    function playWinSound(){
      try{
        const AudioCtx=window.AudioContext||window.webkitAudioContext;
        if(AudioCtx){
          const ctx=new AudioCtx(),now=ctx.currentTime;
          [[523.25,0],[659.25,.11],[783.99,.22]].forEach(([freq,delay])=>{
            const osc=ctx.createOscillator(),gain=ctx.createGain();
            osc.type='triangle';osc.frequency.value=freq;
            gain.gain.setValueAtTime(.0001,now+delay);
            gain.gain.exponentialRampToValueAtTime(.075,now+delay+.018);
            gain.gain.exponentialRampToValueAtTime(.0001,now+delay+.48);
            osc.connect(gain).connect(ctx.destination);
            osc.start(now+delay);osc.stop(now+delay+.5);
          });
          setTimeout(()=>ctx.close().catch(()=>{}),1000);
        }
      }catch{}
      try{navigator.vibrate?.([24,24,42])}catch{}
    }
    function pulseSuccess(){
      shell.classList.remove('success');
      void shell.offsetWidth;
      shell.classList.add('success');
      document.querySelectorAll('[data-clue]').forEach(el=>el.classList.add('connected'));
      answer.classList.add('locked');
      playWinSound();
    }
    function finish(won){
      done=true;
      syncAttempts();
      input.disabled=true;
      $('#connect').disabled=true;
      $('#clear').disabled=true;
      answer.textContent=ANSWER;
      if(won){
        const points=AWARD[guesses]||0;
        $('#score').textContent=points;
        setFeedback('Connection complete.','good');
        feedback.style.visibility='hidden';
        result.innerHTML='<strong>CONNECTED</strong>&nbsp; · &nbsp;SUNFLOWER · SUNLIGHT · SUNSET&nbsp; · &nbsp;'+points+' PTS';
        pulseSuccess();
      }else{
        $('#score').textContent='0';
        setFeedback('Lines exhausted. The connection was SUN.','bad');
        feedback.style.visibility='hidden';
        result.innerHTML='<strong>SUN</strong> → SUNFLOWER · SUNLIGHT · SUNSET';
        document.querySelectorAll('[data-clue]').forEach(el=>el.classList.add('connected'));
        answer.classList.add('locked');
      }
      result.classList.add('show');
      requestAnimationFrame(fitSwitchboardText);
    }
    function submit(){
      if(done)return;
      const guess=sanitize(input.value);
      if(!guess){setFeedback('Patch in one word first.','bad');return}
      guesses++;
      input.value='';
      answer.textContent='';
      syncAttempts();
      if(guess===ANSWER){finish(true);return}
      if(guesses>=3){
        $('#score').textContent='0';
        pulseWrong();
        finish(false);
        return;
      }
      pulseWrong();
      setFeedback(guess+' does not connect all three. Try again.','bad');
      input.focus();
    }
    function reset(){
      guesses=0;done=false;
      input.disabled=false;input.value='';
      $('#connect').disabled=false;
      $('#clear').disabled=false;
      $('#score').textContent='1000';
      answer.textContent='';answer.classList.remove('locked');
      shell.classList.remove('success','wrong');
      result.classList.remove('show');result.innerHTML='';
      feedback.style.visibility='';
      document.querySelectorAll('[data-clue]').forEach(el=>el.classList.remove('connected'));
      setFeedback('Three lines are waiting.');
      syncAttempts();
      input.focus();
    }

    input.addEventListener('input',syncPlate);
    $('#form').addEventListener('submit',e=>{e.preventDefault();submit()});
    $('#connect').addEventListener('click',submit);
    $('#clear').addEventListener('click',()=>{if(done)return;input.value='';syncPlate();setFeedback('Line cleared.');input.focus()});
    $('#reset').addEventListener('click',reset);
    $('#back').addEventListener('click',()=>{location.href='/?play=link'});
    window.addEventListener('resize',()=>requestAnimationFrame(fitSwitchboardText),{passive:true});
    loadScene();
    syncAttempts();
    requestAnimationFrame(fitSwitchboardText);
  })();
  </script>
