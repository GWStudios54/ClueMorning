<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#101a35"/><stop offset=".55" stop-color="#14213a"/><stop offset="1" stop-color="#070a12"/></linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24283a"/><stop offset=".55" stop-color="#111827"/><stop offset="1" stop-color="#090d16"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe2a0"/><stop offset="1" stop-color="#b8782d"/></linearGradient>
  <radialGradient id="moonGlow"><stop stop-color="#fff1b9" stop-opacity=".62"/><stop offset=".4" stop-color="#f5d989" stop-opacity=".22"/><stop offset="1" stop-color="#f5d989" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="windows" width="44" height="52" patternUnits="userSpaceOnUse">
    <rect x="8" y="8" width="8" height="14" rx="1" fill="#d39c54" opacity=".45"/>
    <rect x="26" y="22" width="7" height="12" rx="1" fill="#f2bd64" opacity=".28"/>
  </pattern>
</defs>

<rect width="720" height="1280" fill="url(#sky)"/>
<circle cx="596" cy="192" r="116" fill="url(#moonGlow)"/>
<circle cx="596" cy="192" r="42" fill="#f4ddb0" opacity=".9"/>

