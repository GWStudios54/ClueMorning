<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#080b14">
  <title>Word Steps — Rooftops Painted Test | Clue Morning</title>
  <style>
    :root{--gold:#f0c76f;--ink:#f6ead8;--muted:#cfc2d4;--purple:#765f8b;--panel:rgba(9,10,18,.94)}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a12;color:var(--ink);font-family:Georgia,"Times New Roman",serif}
    button,input{font:inherit}
    button{cursor:pointer}
    button:disabled,input:disabled{opacity:.56;cursor:default}
    .scene{position:fixed;inset:0;overflow:hidden;background:#080b13;isolation:isolate}
    .scene::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(to bottom,rgba(4,6,13,.72),rgba(4,6,13,.18) 24%,transparent 41%,transparent 72%,rgba(4,6,13,.72))}
    .scene::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.075;background:repeating-linear-gradient(to bottom,rgba(255,239,205,.05) 0 1px,rgba(0,0,0,.04) 1px 3px);mix-blend-mode:soft-light}
    .topbar{position:absolute;z-index:40;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:center;pointer-events:none}
    .topbar button,.badge{pointer-events:auto;min-height:46px;border:2px solid rgba(116,91,132,.93);border-radius:14px;background:rgba(9,10,18,.92);color:#f6ead8;box-shadow:0 0 0 2px rgba(3,4,9,.68),0 8px 22px rgba(0,0,0,.28);backdrop-filter:blur(8px)}
    .back{justify-self:start;padding:0 13px;font-size:.86rem}.badge{display:grid;place-items:center;padding:0 14px;color:#edc779!important;font:800 .63rem/1 "Courier New",monospace;letter-spacing:.16em}.reset{justify-self:end;width:46px;padding:0;font-size:1.05rem}
    .title{position:absolute;z-index:38;top:calc(max(10px,env(safe-area-inset-top)) + 55px);left:50%;width:min(540px,88vw);transform:translateX(-50%);text-align:center;pointer-events:none;text-shadow:0 3px 10px rgba(0,0,0,.75)}
    .title small{display:block;color:#cfc2d4;font:900 .59rem/1 "Courier New",monospace;letter-spacing:.27em}.title strong{display:block;margin-top:7px;color:var(--gold);font:800 clamp(1.18rem,5.1vw,1.7rem)/1 Georgia,serif;letter-spacing:.08em}
    .stats{position:absolute;z-index:39;top:calc(max(10px,env(safe-area-inset-top)) + 104px);left:50%;width:min(600px,calc(100vw - 20px));transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
    .stat{min-height:61px;padding:8px 4px;border:2px solid rgba(101,80,113,.94);border-radius:13px;background:linear-gradient(180deg,rgba(13,14,23,.94),rgba(8,9,16,.95));box-shadow:0 0 0 2px rgba(4,5,10,.58),0 9px 24px rgba(0,0,0,.22);text-align:center;backdrop-filter:blur(6px)}
    .stat strong{display:block;color:var(--gold);font:800 1.2rem/1 Georgia,serif}.stat span{display:block;margin-top:6px;color:#cabfd0;font:800 .52rem/1 "Courier New",monospace;letter-spacing:.09em}
    .goal{position:absolute;z-index:39;top:calc(max(10px,env(safe-area-inset-top)) + 173px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;white-space:nowrap;padding:9px 14px;border:2px solid rgba(108,87,122,.9);border-radius:13px;background:rgba(9,10,18,.93);box-shadow:0 0 0 2px rgba(4,5,10,.55),0 9px 20px rgba(0,0,0,.24);color:#d4c8d6;font:800 .61rem/1.2 "Courier New",monospace}.goal b{color:#f1c86f;font-size:.78rem;letter-spacing:.08em}
    .painted-frame{position:absolute;z-index:5;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 208px);width:min(100vw,650px);aspect-ratio:600/514;transform:translateX(-50%);overflow:hidden;background:#0a0e18 url('./rooftops-world.svg') center/cover no-repeat;box-shadow:0 24px 55px rgba(0,0,0,.34)}
    .painted-world{position:absolute;left:0;top:0;width:100%;height:auto;transform:translateY(-7.52%);opacity:0;transition:opacity .26s ease;pointer-events:none;user-select:none}
    html.painted-ready .painted-world{opacity:1}
    .painted-frame::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;box-shadow:inset 0 0 72px rgba(2,4,10,.24)}
    .art-character-cover{position:absolute;z-index:7;left:36.8%;top:37.5%;width:13.5%;height:18.5%;border:1px solid rgba(184,139,67,.46);border-radius:4px 4px 16px 16px;background:linear-gradient(180deg,rgba(13,34,62,.98),rgba(8,22,43,.98));box-shadow:inset 0 0 22px rgba(0,0,0,.38),0 5px 15px rgba(0,0,0,.24)}
    .art-character-cover::before{content:"✦";position:absolute;left:50%;top:18%;transform:translateX(-50%);color:#c49449;font:700 1.25rem/1 Georgia,serif;opacity:.82}
    .art-character-cover::after{content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);border-left:18px solid transparent;border-right:18px solid transparent;border-top:12px solid #08162b}
    .plate-cover{position:absolute;z-index:8;left:50%;transform:translate(-50%,-50%);width:31%;height:8.8%;border:2px solid rgba(121,96,139,.9);border-radius:10px;background:linear-gradient(180deg,rgba(13,14,24,.98),rgba(8,10,18,.99));box-shadow:0 0 0 2px rgba(4,5,10,.7),0 6px 16px rgba(0,0,0,.35)}
    .plate-cover.top{top:13.1%;width:29%}.plate-cover.mid{top:57.2%;width:31%}.plate-cover.bottom{top:84.1%;width:31%}
    .path-layer{position:absolute;inset:0;z-index:12;pointer-events:none}
    .word-sign{position:absolute;transform:translate(-50%,-50%);min-width:92px;padding:7px 9px;border:2px solid rgba(121,96,139,.94);border-radius:10px;background:linear-gradient(180deg,rgba(13,14,24,.98),rgba(8,10,18,.99));color:#ddd0d9;text-align:center;font:900 clamp(.58rem,2.7vw,.75rem)/1 "Courier New",monospace;letter-spacing:.13em;box-shadow:0 0 0 2px rgba(4,5,10,.7),0 6px 16px rgba(0,0,0,.35);transition:transform .3s ease,color .3s ease,border-color .3s ease,box-shadow .3s ease}
    .word-sign.current{color:#f3c974;border-color:#f0c36e;transform:translate(-50%,-50%) scale(1.07);box-shadow:0 0 0 2px rgba(4,5,10,.75),0 0 20px rgba(242,190,99,.25),0 8px 18px rgba(0,0,0,.38)}
    .word-sign.target{color:#f0d79d;border-color:#a78a62}
    .word-sign.micro{min-width:72px;padding:5px 7px;font-size:.54rem;opacity:.92}
    .climber{position:absolute;z-index:15;width:34px;height:57px;transform:translate(-50%,-50%);transition:left 330ms linear,top 510ms cubic-bezier(.2,.8,.2,1),transform 190ms ease;filter:drop-shadow(0 7px 6px rgba(0,0,0,.58))}
    .climber-sprite{position:relative;width:100%;height:100%;transform-origin:center}.climber.facing-left .climber-sprite{transform:scaleX(-1)}
    .climber-head{position:absolute;left:10px;top:1px;width:13px;height:13px;border-radius:50%;background:#e8c9a5}
    .climber-body{position:absolute;left:6px;top:13px;width:22px;height:34px;border:1px solid rgba(255,220,176,.14);border-radius:7px 7px 4px 4px;background:linear-gradient(90deg,#73483f,#9a6251 55%,#704238);box-shadow:0 16px 0 -6px #26334c}
    .climber-bag{position:absolute;left:25px;top:21px;width:8px;height:13px;border-radius:3px;background:#31415b}.climber-scarf{position:absolute;left:24px;top:17px;width:16px;height:4px;border-radius:999px;background:#d9b56d;transform-origin:left center}
    .climber.walking .climber-sprite{animation:bob .27s infinite alternate}.climber.climbing .climber-sprite{animation:climb .22s infinite alternate}.climber.hopping{transform:translate(-50%,-58%)}.climber.walking .climber-scarf,.climber.hopping .climber-scarf{animation:scarf .24s infinite alternate}
    @keyframes bob{from{margin-top:0}to{margin-top:-3px}}@keyframes climb{from{margin-top:0}to{margin-top:-4px}}@keyframes scarf{from{transform:rotate(-7deg)}to{transform:rotate(10deg)}}
    .controls{position:absolute;z-index:45;left:50%;bottom:max(10px,env(safe-area-inset-bottom));width:min(660px,calc(100vw - 18px));transform:translateX(-50%);padding:12px;border:2px solid rgba(113,91,128,.96);border-radius:18px;background:linear-gradient(180deg,rgba(10,11,19,.97),rgba(8,9,16,.98));box-shadow:0 0 0 2px rgba(5,6,11,.78),0 16px 40px rgba(0,0,0,.44);backdrop-filter:blur(9px)}
    .prompt{margin:0 0 9px;color:#d9ceda;text-align:center;font:800 .61rem/1.3 "Courier New",monospace}.prompt b{color:#f4dfb2}
    form{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:8px}
    input{min-width:0;min-height:54px;padding:0 14px;border:2px solid #765f8b;border-radius:14px;background:rgba(15,16,28,.97);box-shadow:0 0 0 2px rgba(5,6,11,.74),inset 0 1px 0 rgba(255,255,255,.03);color:#fff2dc;font:900 16px/1 "Courier New",monospace;letter-spacing:.13em;text-transform:uppercase;outline:none}.add{border:2px solid #8aa0a5;border-radius:14px;background:linear-gradient(180deg,#35545a,#263f45);color:#f5e5c9;font:900 .75rem/1 "Courier New",monospace;box-shadow:0 0 0 2px rgba(5,6,11,.7)}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.actions button{min-height:38px;border:1px solid #55495f;border-radius:11px;background:linear-gradient(180deg,#1a1926,#12121d);color:#dcd0dc;font:800 .61rem/1 "Courier New",monospace}.message{min-height:1.2em;margin:8px 0 0;text-align:center;color:#d0c2ce;font:800 .59rem/1.25 "Courier New",monospace}.message.good{color:#e5cc8d}.message.bad{color:#e2a4a0}
    .complete{display:none;text-align:center;padding:5px}.complete.show{display:block}.complete strong{display:block;color:var(--gold);font:800 1.35rem/1 Georgia,serif}.complete span{display:block;margin-top:7px;color:#cfc2d4;font:800 .63rem/1.25 "Courier New",monospace}.complete button{margin-top:10px;min-height:42px;padding:0 15px;border:2px solid #6b8790;border-radius:10px;background:#294248;color:#fff3df;font-weight:900}
    .loading-note{position:absolute;z-index:13;left:50%;top:52%;transform:translate(-50%,-50%);padding:7px 10px;border-radius:9px;background:rgba(8,10,18,.82);color:#c9bccd;font:800 .56rem/1 "Courier New",monospace;letter-spacing:.08em;transition:opacity .2s}
    html.painted-ready .loading-note{opacity:0;pointer-events:none}
    @media(max-width:420px){.topbar{gap:7px}.back{width:46px;padding:0;font-size:0}.back::after{content:"←";font-size:1.1rem}.badge{padding:0 10px;font-size:.57rem}.title strong{font-size:1.18rem}.stats{top:calc(max(10px,env(safe-area-inset-top)) + 101px)}.goal{top:calc(max(10px,env(safe-area-inset-top)) + 168px)}.painted-frame{top:calc(max(10px,env(safe-area-inset-top)) + 201px)}.controls{padding:10px}.word-sign.micro{min-width:62px;font-size:.49rem}}
    @media(max-height:690px){.title{top:calc(max(6px,env(safe-area-inset-top)) + 49px)}.stats{top:calc(max(6px,env(safe-area-inset-top)) + 94px)}.stat{min-height:54px}.goal{top:calc(max(6px,env(safe-area-inset-top)) + 154px)}.painted-frame{top:calc(max(6px,env(safe-area-inset-top)) + 188px)}.controls{padding:9px}.prompt{margin-bottom:6px}.actions{margin-top:6px}.message{margin-top:6px}}
  </style>
</head>
<body>
  <main class="scene" aria-label="Word Steps Rooftops painted test">
    <div class="topbar">
      <button class="back" type="button" onclick="location.href='/'">← Morning Run</button>
      <div class="badge">ROOFTOPS · TEST</div>
      <button class="reset" id="resetTop" type="button" aria-label="Reset test">↻</button>
    </div>
    <div class="title"><small>WORD STEPS</small><strong>THE ROOFTOPS</strong></div>
    <div class="stats">
      <div class="stat"><strong id="moves">0/8</strong><span>MOVES</span></div>
      <div class="stat"><strong>4</strong><span>PAR</span></div>
      <div class="stat"><strong id="score">1000</strong><span>SCORE</span></div>
    </div>
    <div class="goal"><span>START <b>COLD</b></span><span>→</span><span>TARGET <b>WARM</b></span></div>

    <div class="painted-frame" id="paintedFrame" aria-label="Painted rooftop climb">
      <img id="paintedWorld" class="painted-world" alt="">
      <div class="art-character-cover" aria-hidden="true"></div>
      <div class="plate-cover top" aria-hidden="true"></div>
      <div class="plate-cover mid" aria-hidden="true"></div>
      <div class="plate-cover bottom" aria-hidden="true"></div>
      <div id="pathLayer" class="path-layer"></div>
      <div class="climber" id="climber" aria-hidden="true">
        <div class="climber-sprite">
          <span class="climber-head"></span><span class="climber-body"></span><span class="climber-bag"></span><span class="climber-scarf"></span>
        </div>
      </div>
      <div class="loading-note">OPENING THE ROOFTOPS…</div>
    </div>

    <div class="controls">
      <div id="playUi">
        <p class="prompt">Change exactly one letter. <b>Every valid step takes you higher.</b></p>
        <form id="form">
          <input id="guess" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="NEXT WORD" aria-label="Next four-letter word">
          <button class="add" type="submit">CLIMB</button>
        </form>
        <div class="actions"><button id="undo" type="button">UNDO STEP</button><button id="demo" type="button">PLAY DEMO PATH</button></div>
        <div class="message" id="message">One word closer to a higher view.</div>
      </div>
      <div class="complete" id="complete">
        <strong>ROOFTOP REACHED</strong>
        <span id="finalLine">WARM in 8 moves · 600 points</span>
        <button id="again" type="button">Run the test again</button>
      </div>
    </div>
  </main>

  <script>
  (() => {
    const START='COLD',TARGET='WARM',PAR=4,MAX=8,ART_PARTS=13;
    const WORDS=new Set(['COLD','CORD','CARD','WARD','WARM','WORD','WORE','CORE','CARE','CURE','CURL','CURD','GOLD','TOLD','BOLD','FOLD','HOLD','MOLD','COLT','COLE','CODE','CONE','CORK','CORN','WOLD','WORM','FORM','FARM','HARM','HARD','WARY','WARP','WARN','WART']);
    const NODES=[
      {x:50,y:80.3,edge:'ladder'},{x:50,y:72.8,edge:'ladder'},{x:50,y:65.2,edge:'walk'},
      {x:47,y:58.7,edge:'ladder'},{x:43.5,y:50.5,edge:'walk'},{x:50,y:42.8,edge:'ladder'},
      {x:50,y:34.2,edge:'ladder'},{x:50,y:24.8,edge:'ladder'},{x:50,y:13.2,edge:null}
    ];
    let path=[START],currentNode=0,demoTimer=null,animating=false;
    const $=s=>document.querySelector(s),climber=$('#climber'),layer=$('#pathLayer');

    async function loadPaintedWorld(){
      try{
        const urls=Array.from({length:ART_PARTS},(_,i)=>'./painted/rooftops-'+String(i).padStart(2,'0')+'.b64');
        const parts=await Promise.all(urls.map(async url=>{const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw new Error('Art load failed');return (await r.text()).trim()}));
        const img=$('#paintedWorld');img.src='data:image/webp;base64,'+parts.join('');
        try{await img.decode()}catch{}
        document.documentElement.classList.add('painted-ready');
      }catch(err){console.warn(err)}
    }

    function diffOne(a,b){let n=0;for(let i=0;i<4;i++)if(a[i]!==b[i])n++;return n===1}
    function score(){const m=path.length-1;return Math.max(400,1000-Math.max(0,m-PAR)*100)}
    function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
    function setMessage(text,type=''){const el=$('#message');el.textContent=text;el.className='message'+(type?' '+type:'')}
    function face(a,b){climber.classList.toggle('facing-left',NODES[b].x<NODES[a].x)}
    function setPosition(i){const n=NODES[i];climber.style.left=n.x+'%';climber.style.top=n.y+'%'}

    function renderSigns(){
      layer.innerHTML='';
      path.forEach((word,i)=>{
        const node=word===TARGET?8:Math.min(i,7),n=NODES[node],el=document.createElement('div');
        el.className='word-sign'+(node===currentNode?' current':'')+(node!==0&&node!==4&&node!==8?' micro':'');
        el.textContent=word;el.style.left=n.x+'%';el.style.top=n.y+'%';layer.appendChild(el);
      });
      if(path.at(-1)!==TARGET){
        const n=NODES[8],target=document.createElement('div');target.className='word-sign target';target.textContent=TARGET;target.style.left=n.x+'%';target.style.top=n.y+'%';layer.appendChild(target);
      }
    }
    function renderHud(){
      const moves=path.length-1;$('#moves').textContent=moves+'/'+MAX;$('#score').textContent=score();
      $('#undo').disabled=animating||path.length<=1||path.at(-1)===TARGET;$('#demo').disabled=animating;$('#guess').disabled=animating;document.querySelector('.add').disabled=animating;
    }
    function renderComplete(){
      const won=path.at(-1)===TARGET,m=path.length-1;
      $('#playUi').style.display=won?'none':'';$('#complete').classList.toggle('show',won);
      if(won)$('#finalLine').textContent=TARGET+' in '+m+' move'+(m===1?'':'s')+' · '+score()+' points';
    }
    function renderAll(){renderSigns();renderHud();renderComplete();setPosition(currentNode)}

    async function moveCharacter(to,mode='ladder',fast=false){
      if(to===currentNode)return;const from=currentNode,f=fast ? .68 : 1;face(from,to);animating=true;renderHud();climber.classList.remove('walking','climbing','hopping');
      if(mode==='walk')climber.classList.add('walking');else if(mode==='hop')climber.classList.add('hopping');else climber.classList.add('climbing');
      const n=NODES[to];climber.style.left=n.x+'%';climber.style.top=n.y+'%';await sleep((mode==='hop'?390:530)*f);
      currentNode=to;climber.classList.remove('walking','climbing','hopping');animating=false;renderHud();
    }
    async function summitRun(){
      while(currentNode<8){const next=currentNode+1;await moveCharacter(next,NODES[currentNode].edge||'ladder',true)}
    }
    async function addWord(raw,quiet=false){
      if(animating)return false;const word=String(raw||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
      if(word.length!==4){if(!quiet)setMessage('Enter exactly four letters.','bad');return false}
      if(path.includes(word)){if(!quiet)setMessage('That rooftop is already in your path.','bad');return false}
      if(!WORDS.has(word)){if(!quiet)setMessage(word+' is outside this small prototype dictionary.','bad');return false}
      if(!diffOne(path.at(-1),word)){if(!quiet)setMessage('Change exactly one letter from '+path.at(-1)+'.','bad');return false}
      if(path.length-1>=MAX){if(!quiet)setMessage('Eight moves used. Reset the test to try again.','bad');return false}
      path.push(word);$('#guess').value='';renderSigns();renderHud();
      if(word===TARGET){if(!quiet)setMessage('Target found. Take the roof.','good');await summitRun();setMessage('You made the roof.','good')}
      else{const next=Math.min(currentNode+1,7);await moveCharacter(next,NODES[currentNode].edge||'ladder');if(!quiet)setMessage(word+' holds. Keep climbing.','good')}
      renderAll();return true;
    }
    async function undo(){
      if(path.length<=1||animating||path.at(-1)===TARGET)return;path.pop();const target=Math.max(0,currentNode-1);await moveCharacter(target,'ladder',true);setMessage('Dropped back one rooftop.');renderAll();
    }
    function reset(){
      if(demoTimer)clearTimeout(demoTimer);demoTimer=null;path=[START];currentNode=0;animating=false;$('#guess').value='';setMessage('One word closer to a higher view.');renderAll();$('#guess').focus();
    }
    function playDemo(){
      reset();const demo=['BOLD','FOLD','GOLD','HOLD','WOLD','WORD','WARD','WARM'];let i=0;
      const tick=async()=>{if(i>=demo.length){demoTimer=null;return}await addWord(demo[i++],true);if(i===3)setMessage('GOLD holds. Keep climbing.','good');if(i<demo.length)demoTimer=setTimeout(tick,300);else demoTimer=null};
      demoTimer=setTimeout(tick,350);
    }

    $('#form').addEventListener('submit',async e=>{e.preventDefault();await addWord($('#guess').value)});
    $('#undo').addEventListener('click',undo);$('#demo').addEventListener('click',playDemo);$('#again').addEventListener('click',reset);$('#resetTop').addEventListener('click',reset);
    loadPaintedWorld();renderAll();
  })();
  </script>
</body>
</html>
