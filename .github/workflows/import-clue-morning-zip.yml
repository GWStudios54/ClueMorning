name: Import Clue Morning ZIP

on:
  push:
    branches: [main]
    paths:
      - 'ClueMorning_*.zip'
      - 'ClueMorning*.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f \( -name 'ClueMorning_*.zip' -o -name 'ClueMorning*.zip' \) | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo 'No Clue Morning ZIP found.'
            exit 0
          fi
          echo "path=${ZIP#./}" >> "$GITHUB_OUTPUT"

      - name: Extract project into repository root
        if: steps.zip.outputs.path != ''
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ steps.zip.outputs.path }}"
          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"

          mapfile -t TOP < <(find "$TMP" -mindepth 1 -maxdepth 1 -printf '%p\n')
          if [ "${#TOP[@]}" -eq 1 ] && [ -d "${TOP[0]}" ]; then
            SRC="${TOP[0]}"
          else
            SRC="$TMP"
          fi

          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            "$SRC/" ./
          rm -f "$ZIP"

      - name: Commit imported source
        if: steps.zip.outputs.path != ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing changed.'
            exit 0
          fi
          git commit -m 'Import Clue Morning source from ZIP'
          git push
