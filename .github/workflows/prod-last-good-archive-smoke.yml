name: Production last-good archive smoke

on:
  push:
    branches:
      - prod-last-good-archive-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify last-good archive is live
        shell: bash
        run: |
          set -euo pipefail
          page="https://cluemorning.com/archive-test/"
          for i in $(seq 1 24); do
            body="$(curl -fsSL "$page" || true)"
            if grep -q "DEEP ARCHIVE — LANDING TEST" <<<"$body" \
              && grep -q "archive-top.webp" <<<"$body" \
              && grep -q "archive-middle.webp" <<<"$body" \
              && grep -q "archive-bottom.webp" <<<"$body" \
              && curl -fsSI "https://cluemorning.com/archive-test/archive-top.webp" | grep -qi "content-type: image/webp" \
              && curl -fsSI "https://cluemorning.com/archive-test/archive-middle.webp" | grep -qi "content-type: image/webp" \
              && curl -fsSI "https://cluemorning.com/archive-test/archive-bottom.webp" | grep -qi "content-type: image/webp"; then
              echo "Last-good archive is live."
              exit 0
            fi
            echo "Waiting for deployment ($i/24)..."
            sleep 5
          done
          exit 1
