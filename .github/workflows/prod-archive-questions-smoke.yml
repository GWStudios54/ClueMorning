name: Production archive question smoke

on:
  push:
    branches:
      - prod-archive-questions-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify question-driven archive test is live
        shell: bash
        run: |
          set -euo pipefail
          url="https://cluemorning.com/archive-test/"
          for i in $(seq 1 24); do
            body="$(curl -fsSL "$url" || true)"
            if grep -q "DEEP CUT — ARCHIVE TEST" <<<"$body" \
              && grep -q "QUESTION 1 OF 8" <<<"$body" \
              && grep -q "Name a country beginning with B." <<<"$body" \
              && grep -q "TEST_SECONDS=25" <<<"$body" \
              && grep -q "NOT IN THIS TEST SET — KEEP GUESSING" <<<"$body"; then
              echo "Question-driven archive test is live."
              exit 0
            fi
            echo "Waiting for production deploy ($i/24)..."
            sleep 5
          done
          exit 1
