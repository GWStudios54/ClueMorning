name: Optimize retro archive art

on:
  push:
    branches:
      - archive-retro-painted-restoration

permissions:
  contents: write

jobs:
  optimize:
    if: ${{ !contains(github.event.head_commit.message, 'Optimize retro archive art') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: archive-retro-painted-restoration
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Crop and compress archive assets
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          root=Path('public/archive-test')
          src=root/'deep-archive-retro-25-world.png'
          im=Image.open(src).convert('RGB')
          im=im.crop((0,82,1024,1428))
          im.save(root/'deep-archive-retro-25-world.webp','WEBP',quality=82,method=6)

          elev=Image.open(root/'deep-archive-retro-elevator.png').convert('RGB')
          elev.save(root/'deep-archive-retro-elevator.webp','WEBP',quality=88,method=6)
          PY
          rm -f public/archive-test/deep-archive-retro-25-world.png
          rm -f public/archive-test/deep-archive-retro-world.png
          rm -f public/archive-test/deep-archive-retro-elevator.png
      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize retro archive art"
          git push origin HEAD:archive-retro-painted-restoration
