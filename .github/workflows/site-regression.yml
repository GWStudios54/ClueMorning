name: Clue Morning regression

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'src/**'
      - 'tools/**'
      - 'package.json'
      - 'schema.sql'
      - 'wrangler.jsonc'
      - '.github/workflows/site-regression.yml'
  pull_request:
    paths:
      - 'public/**'
      - 'src/**'
      - 'tools/**'
      - 'package.json'
      - 'schema.sql'
      - 'wrangler.jsonc'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run regression suite
        run: npm test
