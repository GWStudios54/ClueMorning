name: Daily content quality

on:
  push:
    branches:
      - main
      - 'fix/deep-cut-*'
      - 'feature/content-integrity-*'
    paths:
      - 'package.json'
      - 'test.mjs'
      - 'content/source/groups.json'
      - 'content/source/deepcut_prompts.json'
      - 'content/source/deepcut_quality_*.json'
      - 'content/source/schedule.json'
      - 'tools/content-integrity.mjs'
      - 'tools/audit-four-groups.mjs'
      - 'tools/deep-cut-quality.mjs'
      - 'tools/deep-cut-rarity-order.mjs'
      - 'tools/curate-deep-cut-sets.mjs'
      - 'tools/audit-deep-cut-daily.mjs'
      - 'tools/rebuild_content.mjs'
      - 'src/worker-v4.js'
      - 'public/app.js'
      - 'public/app-core.js'
      - 'public/sw.js'
      - 'wrangler.jsonc'
      - '.github/workflows/deep-cut-content.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-and-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Rebuild curated content
        run: npm run rebuild:content

      - name: Run tests and content audits
        run: npm test

      - name: Commit generated content artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/generated/deep_cut.json content/generated/deep_cut_quality.json src/puzzles.js
          if git diff --cached --quiet; then
            echo "Generated content artifacts already current."
            exit 0
          fi
          git commit -m "Rebuild validated daily content"
          git push
