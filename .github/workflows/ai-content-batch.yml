name: AI content batch

on:
  workflow_dispatch:
    inputs:
      game:
        description: Puzzle family to generate
        required: true
        default: four-groups
        type: choice
        options:
          - four-groups
          - deep-cut
      count:
        description: Number of approved candidates to produce
        required: true
        default: '30'
        type: string

permissions:
  contents: read

jobs:
  generate-and-critique:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Generate, hard-validate, and AI-critique candidates
        env:
          CLUE_AI_ENDPOINT: ${{ vars.CLUE_AI_ENDPOINT }}
          CLUE_AI_MODEL: ${{ vars.CLUE_AI_MODEL }}
          CLUE_AI_API_KEY: ${{ secrets.CLUE_AI_API_KEY }}
        run: npm run content:ai -- --game=${{ inputs.game }} --count=${{ inputs.count }}

      - name: Upload candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clue-morning-${{ inputs.game }}-candidates
          path: content/generated/ai_candidates.json
          if-no-files-found: warn
