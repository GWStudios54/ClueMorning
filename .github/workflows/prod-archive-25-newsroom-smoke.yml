name: Production archive 25-floor newsroom smoke

on:
  push:
    branches:
      - prod-archive-25-newsroom-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify 25-floor newsroom archive test is live
        shell: bash
        run: |
          set -euo pipefail
          url="https://cluemorning.com/archive-test/"
          for i in $(seq 1 24); do
            body="$(curl -fsSL "$url" || true)"
            if grep -q "DEEP ARCHIVE — 25 FLOOR TEST" <<<"$body" \
              && grep -q "Newsroom Lobby" <<<"$body" \
              && grep -q "The Final Shelf" <<<"$body" \
              && grep -q "data-jump=\"3\"" <<<"$body" \
              && grep -q -- "--elevator-h:156px" <<<"$body"; then
              echo "25-floor newsroom archive test is live."
              exit 0
            fi
            echo "Waiting for production deploy ($i/24)..."
            sleep 5
          done
          exit 1
