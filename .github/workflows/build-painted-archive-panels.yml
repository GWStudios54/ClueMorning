name: Build painted archive panels

on:
  push:
    branches:
      - archive-25-painted-panels-v2

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reconstruct and optimize generated archive panels
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow

          cat tmp/archive-newsroom-source.png.b64.part* | base64 -d > /tmp/archive-newsroom.png
          cat tmp/archive-museum-source.png.b64.part* | base64 -d > /tmp/archive-museum.png
          cat tmp/archive-cosmic-source.png.b64.part* | base64 -d > /tmp/archive-cosmic.png

          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          jobs = [
              ("/tmp/archive-newsroom.png", "public/archive-test/archive-newsroom-25.webp"),
              ("/tmp/archive-museum.png", "public/archive-test/archive-museum-25.webp"),
              ("/tmp/archive-cosmic.png", "public/archive-test/archive-cosmic-25.webp"),
          ]

          for src, dst in jobs:
              im = Image.open(src).convert("RGB")
              im = im.resize((960, 1200), Image.Resampling.LANCZOS)
              Path(dst).parent.mkdir(parents=True, exist_ok=True)
              im.save(dst, "WEBP", quality=72, method=6)
              print(dst, Path(dst).stat().st_size)
          PY

          rm -f tmp/archive-newsroom-source.png.b64.part*
          rm -f tmp/archive-museum-source.png.b64.part*
          rm -f tmp/archive-cosmic-source.png.b64.part*

          git add public/archive-test/archive-newsroom-25.webp \
                  public/archive-test/archive-museum-25.webp \
                  public/archive-test/archive-cosmic-25.webp \
                  tmp
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build optimized painted archive panels"
          git push
