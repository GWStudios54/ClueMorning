name: Deploy Clue Morning

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ClueMorning*.zip'
      - 'ClueMorning_*.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository secret.'; exit 1; }

      - name: Install dependencies
        run: npm install

      - name: Ensure D1 leaderboard binding
        run: node tools/ensure_d1_binding.mjs

      - name: Apply leaderboard schema
        run: npx wrangler d1 execute DB --remote --file=schema.sql

      - name: Run tests
        run: npm test

      - name: Deploy Clue Morning
        run: npx wrangler deploy
