name: Optimize archive art assets

on:
  push:
    branches:
      - archive-stacked-high-quality-art

permissions:
  contents: write

jobs:
  optimize-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: archive-stacked-high-quality-art
      - name: Convert archive panels to WebP
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          for stem in ("archive-top", "archive-middle", "archive-bottom"):
              src = Path("public/archive-test") / f"{stem}.png"
              dst = Path("public/archive-test") / f"{stem}.webp"
              im = Image.open(src).convert("RGB")
              im.save(dst, "WEBP", quality=82, method=6)
              print(stem, im.size, dst.stat().st_size)
          PY
          rm public/archive-test/archive-top.png \
             public/archive-test/archive-middle.png \
             public/archive-test/archive-bottom.png
          test "$(wc -c < public/archive-test/archive-top.webp)" -gt 200000
          test "$(wc -c < public/archive-test/archive-middle.webp)" -gt 200000
          test "$(wc -c < public/archive-test/archive-bottom.webp)" -gt 200000
      - name: Commit optimized archive panels
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/archive-test
          if git diff --cached --quiet; then
            echo "No asset changes."
            exit 0
          fi
          git commit -m "Optimize stacked archive panels"
          git push origin HEAD:archive-stacked-high-quality-art
