name: Production retro archive camera smoke

on:
  push:
    branches:
      - prod-retro-camera-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify fixed retro archive camera is live
        shell: bash
        run: |
          set -euo pipefail
          url="https://cluemorning.com/archive-test/"
          for i in $(seq 1 24); do
            body="$(curl -fsSL "$url" || true)"
            if grep -q "DEEP ARCHIVE — COZY RETRO TEST" <<<"$body" \
              && ! grep -q "roof-fill" <<<"$body" \
              && grep -q "topWorldLimit" <<<"$body" \
              && grep -q "landingScreenY" <<<"$body"; then
              echo "Fixed retro archive camera is live."
              exit 0
            fi
            echo "Waiting for production deploy ($i/24)..."
            sleep 5
          done
          exit 1
