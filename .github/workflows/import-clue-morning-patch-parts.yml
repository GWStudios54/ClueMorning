name: Import Clue Morning Patch Parts

on:
  push:
    branches: [main]
    paths:
      - 'patches/v2.6.3/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reassemble and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat patches/v2.6.3/part* > /tmp/patch.b64
          base64 -d /tmp/patch.b64 > /tmp/patch.zip
          unzip -t /tmp/patch.zip
          TMP="$(mktemp -d)"
          unzip -q /tmp/patch.zip -d "$TMP"
          rsync -a "$TMP/" ./
          rm -rf patches/v2.6.3
          rm -f ClueMorningPatch_v2.6.3_WifeFeedback.zip

      - name: Test patched source
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock
          npm test
          rm -rf node_modules

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish Trail, Groups, and Letter Grid'
          git push
