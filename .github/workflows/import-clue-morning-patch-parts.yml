name: Import Clue Morning v2.7.0

on:
  push:
    branches: [main]
    paths:
      - 'patches/v2.7.0/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reassemble and apply v2.7.0
        shell: bash
        run: |
          set -euo pipefail
          cat patches/v2.7.0/part[0-9][0-9] > /tmp/patch.b64
          base64 -d /tmp/patch.b64 > /tmp/patch.zip
          echo "2edb541b151d05bb2218a33d31e0bb436f6537c45198a37d05fa760119ce8397  /tmp/patch.zip" | sha256sum -c -
          unzip -t /tmp/patch.zip
          TMP="$(mktemp -d)"
          unzip -q /tmp/patch.zip -d "$TMP"
          rsync -a "$TMP/" ./
          rm -rf patches/v2.7.0

      - name: Test v2.7.0
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock
          npm test
          rm -rf node_modules

      - name: Commit v2.7.0 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build Unlimited library v2.7.0'
          git push
